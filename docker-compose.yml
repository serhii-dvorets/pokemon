services:
  mongo:
    image: mongo:7
    container_name: pokemon_mongo
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 72
    volumes:
      - pokemon_mongo_data:/data/db
    ports:
      - "27017:27017"

  backend:
    build:
      context: ./nest_be
      dockerfile: ./docker/backend/Dockerfile
    container_name: pokemon_backend
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - ./nest_be/docker/.env.backend
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB_NAME: pokemon
      PORT: 8000
    command: sh -c "npm run start:dev"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://localhost:8000/",
        ]
      interval: 1s
      timeout: 1s
      retries: 40
      start_period: 1s
    volumes:
      - ./nest_be:/app
      - /app/node_modules
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./react_fe
      dockerfile: ./Dockerfile
    container_name: pokemon_frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    command: sh -c "npm run dev -- --host 0.0.0.0 --port 5173"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://localhost:5173/",
        ]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 20s
    volumes:
      - ./react_fe:/app
      - /app/node_modules
    ports:
      - "5173:5173"

volumes:
  pokemon_mongo_data:
